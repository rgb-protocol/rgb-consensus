[package]
name = "rgb-consensus"
version = "0.11.1"
authors = ["Zoe Faltibà <zoefaltiba@gmail.com>"]
description = "RGB Consensus Library: confidential & scalable smart contracts on Bitcoin & Lightning (consensus layer)"
repository = "https://github.com/rgb-protocol/rgb-consensus"
homepage = "https://rgb.info"
keywords = ["bitcoin", "lightning", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85.0"
exclude = [".github"]

[lib]
name = "rgbcore"
crate-type = ["cdylib", "rlib"] # We need this for WASM

[dependencies]
rgb-aluvm = { version = "~0.11.1", features = [
    "rgb-ascii-armor",
    "std",
] }
amplify = { version = "=4.8.1", features = [
    "rand",
] }
baid64 = "=0.4.1"
base85 = "=2.0.0"
bitcoin = { version = "0.32.101", features = [
    "serde",
] }
chrono = "0.4.45"
daggy = { version = "0.9.0", features = [
    "serde-1",
] }
hex-conservative = { version = "1.2.0", optional = true }
rand = "0.9.1"
ripemd = "0.2.0"
secp256k1 = { version = "0.33.1", features = [
    "global-context",
    "rand",
] }
serde_crate = { package = "serde", version = "1", features = [
    "derive",
], optional = true }
sha2 = "0.11.0"
rgb-strict-encoding = { version = "~1.0.4", features = [
    "bitcoin",
] }
rgb-strict-types = { version = "~1.0.4", features = [
    "armor",
] }

[features]
default = []
all = [
    "serde",
]
stl = [
    "rgb-aluvm/stl",
]
serde = [
    "rgb-aluvm/serde",
    "hex-conservative",
    "secp256k1/serde",
    "serde_crate",
    "rgb-strict-encoding/serde",
    "rgb-strict-types/serde",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom2 = { version = "0.2", package = "getrandom", features = [
    "js",
] }
getrandom = { version = "0.3", features = [
    "wasm_js",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
features = ["all"]

[patch.crates-io]
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "1598d8c" }
